plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.107'
    id 'net.darkhax.curseforgegradle' version '1.1.15'
    id 'com.modrinth.minotaur' version '2.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "create-shufflefilter"
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = parchment_mappings_version
    }

    mods {
        createshufflefilter {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file("run")
            
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'mixin.debug.verbose', 'true'
            systemProperty 'mixin.checks.interfaces', 'false'
            programArguments.addAll '--mixin.config', 'createshufflefilter.mixins.json'
        }

        server {
            server()
            gameDirectory = project.file("run/server")
            
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            programArguments.addAll '--mixin.config', 'createshufflefilter.mixins.json'
        }

        data {
            data()
            gameDirectory = project.file("run")
            
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

repositories {
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/mirror" } // Registrate
    mavenCentral()
}

// Sets up a dependency configuration called 'localRuntime'.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Use jarJar like Create does to properly bundle dependencies
    modImplementation(jarJar("com.tterrag.registrate:Registrate:${registrate_version}"))

    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly(jarJar("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}") {
        version {
            strictly "[1.0,2.0)"
            prefer flywheel_version
        }
    })

    // Use jarJar for Ponder like Create does - this properly handles the production JAR
    jarJar(modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"))
    
    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }

    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))

    // https://discord.com/channels/313125603924639766/725850371834118214/910619168821354497
    // Prevent Mixin annotation processor from getting into IntelliJ's annotation processor settings
    // This allows 'Settings > Build, Execution, and Deployment > Build Tools > Gradle > Build and run using' set to IntelliJ to work correctly
    if (!Boolean.getBoolean("idea.sync.active")) {
        annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    }
}

sourceSets.main {
    resources {
        srcDir("src/main/templates")
        srcDir("src/generated/resources")
        exclude(".cache/")
    }
}

processResources {
    var replaceProperties = [
        mod_id         : mod_id,
        mod_name       : mod_name,
        mod_version    : mod_version,
        mod_authors    : mod_authors,
        mod_description: mod_description,
        mod_license    : mod_license,
        loader_version_range: loader_version_range,
        minecraft_version_range: minecraft_version_range,
        create_version_range: create_version_range
    ]

    // Replaces FML's magic file.jarVersion string with the correct version at build time.
    replaceProperties.put("file", [jarVersion: project.version])

    filesMatching(["META-INF/mods.toml"]) {
        expand(replaceProperties)
    }
}

jar {
    String name = base.archivesName.get()

    from("LICENSE") {
        rename { "${it}_${name}" }
    }

    manifest.attributes([
            "MixinConfigs": "createshufflefilter.mixins.json"
    ])
}

// Helper function to get changelog from multiple sources (configuration-cache safe)
def getChangelogProvider() {
    return providers.provider {
        // 1. Check for -Pchangelog property
        if (project.hasProperty('changelog')) {
            return project.property('changelog')
        }
        
        // 2. Check for CHANGELOG.md file
        def changelogFile = file('CHANGELOG.md')
        if (changelogFile.exists()) {
            return changelogFile.text
        }
        
        // 3. Try to get latest git commit message
        try {
            def stdout = new ByteArrayOutputStream()
            exec {
                commandLine 'git', 'log', '-1', '--pretty=%B'
                standardOutput = stdout
                ignoreExitValue = true
            }
            def message = stdout.toString().trim()
            if (message && !message.isEmpty()) {
                return message
            }
        } catch (Exception e) {
            // Git not available or not a git repo
        }
        
        // 4. Fallback to simple version string
        return "Release ${version}"
    }
}

// CurseForge Publishing Configuration
task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = findProperty('curseforge_api_key')
    
    def projectId = findProperty('curseforge_project_id')
    def mainFile = upload(projectId, jar)
    
    mainFile.displayName = "${mod_name} ${version}"
    mainFile.releaseType = 'release'
    mainFile.changelog = getChangelogProvider()
    mainFile.changelogType = 'markdown'
    
    // Add game versions and mod loader
    mainFile.addGameVersion(minecraft_version)
    mainFile.addModLoader('Forge')
    
    // Add dependencies
    mainFile.addRequirement(findProperty('curseforge_create_mod_slug') ?: 'create')
}

// Modrinth Publishing Configuration
modrinth {
    token = providers.gradleProperty('modrinth_token')
    projectId = project.findProperty('modrinth_project_id')
    
    versionNumber = version
    versionName = "${mod_name} ${version}"
    versionType = 'release' // 'alpha', 'beta', or 'release'
    
    uploadFile = tasks.jar
    
    gameVersions = [minecraft_version]
    loaders = ['forge']
    
    changelog = getChangelogProvider()
    
    dependencies {
        required.project 'create'
    }
}

// Convenience tasks for publishing
tasks.register('releaseCurseForge') {
    group = 'upload'
    description = 'Builds and uploads the jar to CurseForge'
    dependsOn 'publishCurseForge'
}

tasks.register('releaseModrinth') {
    group = 'upload'
    description = 'Builds and uploads the jar to Modrinth'
    dependsOn 'modrinth'
}

tasks.register('release') {
    group = 'upload'
    description = 'Builds and uploads the jar to both CurseForge and Modrinth'
    dependsOn 'releaseCurseForge', 'releaseModrinth'
}